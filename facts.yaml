sources:
  local: {by: 本地 Codex, date: "2026-10-21", method: SSH 只读核验}
  admin: {by: 用户, received: "2026-10-21—22", method: 管理员命令输出, execution_time: 未提供精确时间}
  user: {by: 用户, date: "2026-10-22", method: 设计意图确认}
  history: {by: Web 历史交接, verification: 未独立复核}
  ddns_review: {by: 本地 Codex, date: "2026-10-22", checked_at: "2026-10-22T07:53:15+08:00", method: SSH 只读检查部署声明及 HTTP 入口}
  ddns_logs: {by: 用户, date: "2026-10-22", method: 提供脱敏运行日志, log_window: "2026-10-22 07:04:04—07:44:05（日志时间）"}
  ddns_confirmation: {by: 用户, date: "2026-10-22", method: 明确确认 DDNS 已成功}
  deployment_review: {by: 本地 Codex, checked_at: "2026-10-22T09:15:12+08:00", method: 只读检查可访问的 Compose、Docker 日志配置及 Caddy 入口声明}
  public_access_decision: {by: 用户, date: "2026-10-22", method: 确认使用已申请域名及已生效 DDNS，从公网访问本地服务}
  web_https_handoff: {by: 用户转交 Web 任务记录, date: "2026-10-22", method: Caddy 变更、DNS、UFW、路由器及公司外网测试交接, scope: 未提供每条命令的完整原始输出，按用户执行记录标注}
  https_review: {by: 本地 Codex, checked_at: "2026-10-22T11:48:13+08:00", method: SSH 只读核对 Caddyfile、有效配置、DNS IPv4 一致性及本机 HTTP/TLS}
  https_final_handoff: {by: 用户转交 Web 收尾记录并确认完成, date: "2026-10-22", method: 4129 入口、映射及 UFW 清理、自定义镜像、容器重建与内外网访问结果}
  https_final_review: {by: 本地 Codex, checked_at: "2026-10-22T20:54:53+08:00", method: SSH 只读核验可读部署声明、有效路由、LAN HTTP、可信 TLS 与 HTTPS 响应, scope: HTTPS 测试通过 LAN 直连服务器 443，未独立模拟外网路由器入口；未登录应用或读取凭据}
  network_handoff: {by: 用户转交 Web 05.1 规范及只读检查摘要, received: "2026-10-23", execution_time: 未提供精确时间, scope: 防火墙检查由用户执行；本地仅审阅交接正文，未收到原始命令输出，未对服务器独立复核}
# 各节 source 对应上述来源；pending 为未验证项，intent 为用户设计。

server:
  source: [local]
  os: Ubuntu 26.04.1 LTS
  kernel: 7.0.0-38-generic
  architecture: x86_64
  cpu: {model: AMD Ryzen 5 3600, cores: 6, threads: 12}
  memory: 约 16GB
  swap: 4Gi
  timezone: UTC
  ntp_synchronized_reported: true
  updates: {apt_automatic: enabled, unattended_upgrades: enabled}
  pending: [近期自动升级是否成功]

storage:
  source: [local, user]
  system_ssd:
    device: /dev/nvme0n1
    capacity: 约 1TB
    root_partition: /dev/nvme0n1p2
    mount: /
    intent: 保存系统及重建 Docker 服务所需的配置、业务数据和私密资料
  runtime_ssd:
    device: /dev/nvme1n1p1
    capacity: 约 500GB
    filesystem: ext4
    mount: /srv/docker-data
    uuid: 880cc4e1-3cf0-44cb-aa71-97d0bc3b15a5
    intent: 保存镜像等可重建的 Docker 运行时内容
    mount_protection:
      fstab: {nofail: true, device_timeout: 10s}
      startup: Docker 和 containerd 依赖挂载，并校验 UUID
      pending: [缺盘故障测试]
  hdd:
    device: /dev/sda
    capacity: 约 3TB
    partitions_observed: 2
    mountpoints_observed: []
    constraint: 未挂载不代表空盘，未经明确授权禁止磁盘写入

directories:
  source: [local, admin, user]
  deployment: /srv/apps/<service>/
  deployment_contents: Compose 等部署声明，已见 tududi、caddy、ddns-go
  persistent_data: /srv/persistent/data/<service>/
  secrets: /srv/persistent/secrets/<service>/
  persistent_location: 1TB 系统盘
  rules:
    - 后续服务沿用现有目录分工
    - 私密配置内容不进入公开仓库
    - 按实际内容判断保留需求，不能将所有 Docker volume 都视为可丢弃数据
    - Git 保存 Web 所需知识和脱敏摘要，不同步服务器目录

docker:
  source: [local, admin, deployment_review]
  client_version: 29.9.1
  compose_version: v5.6.0
  services_running: [docker, containerd]
  storage_driver: overlayfs
  snapshotter: io.containerd.snapshotter.v1
  logging_declaration:
    source: [deployment_review]
    daemon_default_driver: local
    scope: 来自 daemon.json 声明；现有容器实际日志驱动和轮转参数未逐项核验
  paths:
    docker_root: /srv/docker-data/engine/docker
    containerd_root: /srv/docker-data/engine/containerd
    containerd_state: /run/containerd
    docker_config: /etc/docker/daemon.json
    containerd_config: /etc/containerd/config.toml
    docker_dropins: /etc/systemd/system/docker.service.d/
    containerd_dropins: /etc/systemd/system/containerd.service.d/
    disk_check: /usr/local/sbin/verify-docker-data-disk
  daemon_proxy:
    http: http://192.168.1.120:5780
    https: http://192.168.1.120:5780
    no_proxy: [localhost, 127.0.0.1, "::1", 192.168.1.0/24]
    dependency: Windows PC
    tcp_reachable: true
    pending: [重新拉取镜像验证]

services:
  tududi:
    source: [local, admin, https_final_handoff, https_final_review]
    purpose: 任务管理
    image: chrisvel/tududi:1.9.5
    state: running
    health: healthy
    restart: unless-stopped
    network: tududi_default
    compose: /srv/apps/tududi/compose.yaml
    port: {host_ip: 127.0.0.1, host: 13002, container: 3002, protocol: tcp}
    entry:
      local_upstream: {url: "http://127.0.0.1:13002/", observed_http_status: 200, source: [https_final_review]}
      lan: {url: "http://192.168.1.110/", observed_http_status: 200, source: [https_final_review]}
      public_target: "https://tududi.<DOMAIN>:4129"
      public_status: 已完成；本地核验证书及 HTTPS 200，真实外网访问和实际使用由用户确认
    mounts:
      - {target: /app/db, source: /srv/persistent/data/tududi/db, type: bind, writable: true}
      - {target: /app/uploads, source: /srv/persistent/data/tududi/uploads, type: bind, writable: true}
      - {target: /app/backups, type: anonymous_volume, disk: runtime_ssd, writable: true, observed_empty: true}
    database_directory: 有两份备份类文件及 SQLite WAL、SHM 文件
    pending: [备份文件一致性, uploads 备份覆盖, 恢复能力]

  caddy:
    source: [local, admin, https_final_handoff, https_final_review]
    purpose: Tududi 公网 HTTPS 及局域网 HTTP 入口
    image: caddy:2.11.4-alidns
    image_scope: 自定义镜像由用户确认运行，本地核对 Compose 声明及有效 AliDNS TLS 配置，未查询 Docker inspect
    state: running
    health: not-configured
    restart: unless-stopped
    network: host
    compose: /srv/apps/caddy/compose.yaml
    http_port: 80
    https_port: 443
    caddyfile_sites: ["https://<TUDUDI_FQDN>", "http://<TUDUDI_FQDN>", "http://192.168.1.110"]
    build:
      dockerfile: /srv/apps/caddy/Dockerfile
      base_images: ["caddy:2.11.4-builder-alpine", "caddy:2.11.4-alpine"]
      plugin: github.com/caddy-dns/alidns@c8c945ded9ace193e86f063842ba59981b35146b
      scope: 本地读取构建文件，未执行构建或读取运行镜像元数据
    dns_credentials:
      env_file: /srv/persistent/secrets/caddy/alidns.env
      caddyfile_uses_env_references: true
      ram_policy: 未读取最终授权策略，不将先前候选策略作为实际权限
      scope: 仅核对引用方式，不读取凭据或断言文件权限已复核
    configuration_change:
      source: [https_final_handoff, https_final_review]
      container_recreated: 用户确认强制重建，解决单文件 bind 仍读取旧配置的问题
      file_consistency: 用户交接宿主机与容器 Caddyfile 校验值相同；本地复核有效跳转、路由和 TLS 配置与当前目标一致
      bak_cleanup: 用户确认已删除本轮 4 个历史 .bak，未留额外服务器备份；本地目录检查未发现 .bak 文件
      rollback_note: 旧 .bak 已删除，不再将原备份路径作为可用回退文件
    mounts:
      - {target: /etc/caddy/Caddyfile, source: /srv/apps/caddy/Caddyfile, type: bind, writable: false}
      - {target: /data, source: /srv/persistent/data/caddy/data, type: bind, writable: true}
      - {target: /config, source: /srv/persistent/data/caddy/config, type: bind, writable: true}
    routes:
      tududi_domain:
        host: "<TUDUDI_FQDN>"
        upstream: "127.0.0.1:13002"
        http_observed: "308 → https://<TUDUDI_FQDN>:4129/"
        https_observed: 可信 TLS、SNI 域名匹配及 HTTPS 200，本地通过 LAN 443 检查
      lan_ip_root: {host: 192.168.1.110, allowed_source: 192.168.1.0/24, upstream: "127.0.0.1:13002", observed_http_status: 200}
      ddns_admin:
        site: "http://192.168.1.110"
        path: /ddns-go/*
        upstream: "127.0.0.1:19876"
        strip_prefix: /ddns-go
        location_prefix_rewrite: 已存在
        allowed_source: 192.168.1.0/24
        other_sources_status: 403
        verification: LAN 请求为 307 跳转登录页、登录页 200；回环来源使用同一 IP Host 请求为 403；公网域名有效路由仅代理 Tududi
    certificate_status:
      source: [https_final_handoff, https_final_review]
      validation_method: DNS-01
      active_dns_provider: alidns
      issuer: "Let's Encrypt / YE1"
      trusted_chain_verified: true
      hostname_matched: true
      tls_version_observed: TLSv1.3
      not_before: "2026-10-22T08:07:02Z"
      not_after: "2027-01-20T08:07:01Z"
      https_http_status: 200
      renewal: Caddy 自动管理；本轮验证配置及当前证书，不声称已跨续期周期观察

  ddns_go:
    source: [local, admin, user, ddns_review, ddns_logs, ddns_confirmation, deployment_review]
    purpose: 动态 DNS
    image: ghcr.io/jeessy2/ddns-go:v6.17.7
    state: running
    health: not-configured
    restart: unless-stopped
    network: ddns-go_default
    compose: /srv/apps/ddns-go/compose.yaml
    port: {host_ip: 127.0.0.1, host: 19876, container: 9876, protocol: tcp}
    mount: {target: /root, source: /srv/persistent/secrets/ddns-go, type: bind, writable: true}
    private_config: /srv/persistent/secrets/ddns-go/.ddns_go_config.yaml
    permissions: {directory: "0700", config: "0600"}
    compose_declares:
      source: [ddns_review, deployment_review]
      interval_seconds: 300
      timezone: Asia/Shanghai
      read_only_rootfs: true
      cap_drop: [ALL]
      no_new_privileges: true
      logging: {driver: json-file, max_size: 10m, max_file: "3"}
    anonymous_web_check:
      source: [ddns_review]
      redirect: /ddns-go/ → /ddns-go/login
      login_http_status: 200
      static_resources: 8 个返回 200
    automatic_checks:
      source: [ddns_logs]
      ipv4_detection: 日志显示约每 5 分钟检测一次，地址未变化
      provider_comparison: "07:19:05 应用报告 IP 与 DNS 服务商记录一致，跳过更新"
    pending: [逐项复核运行时参数]
    acceptance:
      local_verified: 部署声明、登录页重定向、静态资源及回环来源拒绝
      user_confirmed: DDNS 已完成，自动更新成功
      source: [ddns_review, ddns_logs, ddns_confirmation]
      scope: 更新成功依据用户明确确认；未表述为本地直接观察到 DNS 写入或独立解析验证
      result: 已完成
    historical_dns_plan:
      source: [history]
      provider: 阿里云 DNS
      intent: IPv4 更新已有记录
      pending: [当前记录名, 记录类型, TTL, 有效 RAM 权限]

network:
  source: [local, admin, https_final_handoff, https_final_review]
  public_access:
    source: [public_access_decision, https_final_handoff, https_final_review]
    domain_registered: true
    ddns_active: true
    intended_route: 公网域名 HTTPS → 家庭网络入口 → Caddy → 本地服务
    application: tududi
    target_url: "https://tududi.<DOMAIN>:4129"
    https_status: 已完成，本地只读核验与用户完成确认共同支持
    dns:
      cname: {name: "tududi.<DOMAIN>", target: "<DOMAIN>", source: [web_https_handoff]}
      root_a: 由现有 ddns-go 维护
      ipv4_answer_sets_equal: {value: true, source: [https_review]}
      wan_matches_dns: {value: true, source: [web_https_handoff]}
    router_mappings:
      source: [https_final_handoff]
      server: 192.168.1.110
      tcp:
        - {external: 4129, internal: 443, state: 用户确认唯一保留的映射}
      removed_external_tcp: [80, 443, 18080, 18443]
      cleanup: 用户确认已完成；本地审查账号不能查询路由器
    external_test:
      source: [https_final_handoff]
      result: 用户确认 4129 公网入口及内外网访问正常，本轮完成
      independent_scope: 本地证书及 HTTPS 检查走 LAN，不冒充真实外网端到端测试或已登录应用
    acceptance:
      result: 已完成
      local_verified: 可信证书、域名匹配、HTTPS 200、4129 跳转、LAN 根路径及 DDNS 管理限制、可读部署声明、无 .bak 文件
      user_confirmed: 真实外网访问、本轮实际使用、路由器唯一映射及旧映射清理、UFW 收尾、容器重建及两端配置校验一致
    future_standard_ports: 若以后标准端口可用，优先调整路由器及必要的跳转配置，保持服务器 443 与 Tududi 13002 不变
  interface: enp34s0
  ipv4: 192.168.1.110/24
  gateway: 192.168.1.1
  netplan: {file: /etc/netplan/00-installer-config.yaml, dhcp4: false, dhcp6: true}
  ipv6: {global_scope_address_observed: true, address: 不公开}
  ufw:
    rules_source: [https_final_handoff, network_handoff]
    active: true
    default: {incoming: deny, outgoing: allow, routed: deny}
    default_last_verified: "2026-10-21"
    latest_report: {source: [network_handoff], default_unchanged_reported: true, ipv6_config_enabled: true, ipv6_user_allow_rules_shown: false, scope: 交接摘要报告 IPV6=yes、未显示对应 v6 用户放行规则；不等于 IPv6 无流量或公网安全已验证}
    user_rules:
      - {from: 192.168.1.0/24, protocol: tcp, ports: [22, 80], action: allow}
      - {from: 0.0.0.0/0, protocol: tcp, ports: [443], action: allow, scope: 用户确认保留公网 443、删除公网 80，IPv6 未独立复核}
    removed: 公网 TCP 80 放行规则，用户确认
  firewall_snapshot_reported:
    source: [network_handoff]
    iptables_version: "iptables v1.8.11 (nf_tables)"
    backend_scope: 此版本字符串表示 iptables 使用 nf_tables API，不能据此判定 Docker 使用原生 nftables 后端；Docker 实际后端未独立核验
    ipv4_forward_policy: DROP
    ipv6_input_policy: DROP
    ipv6_forward_policy: DROP
    forward_chain_order: 交接报告 IPv4、IPv6 FORWARD 中 DOCKER-USER、DOCKER-FORWARD 先于 UFW 转发链
    ipv4_nat: 交接报告 127.0.0.1 的 13002、19876 分别转发至 Tududi、DDNS 容器端口
    scope: 用户执行的只读检查摘要；仅为部分链与 NAT 快照，不构成完整转发安全审查，默认 DROP 不证明所有访问路径安全
  listeners:
    source: [local, https_final_review]
    non_loopback_tcp: [22, 80, 443]
    loopback_tcp: [13002, 19876, 2019]
    caddy_active_listen: [":80", ":443"]
    tcp_443_observed: true
  pending:
    - 完整 Docker 转发链审查
    - IPv6 公网可达性及 IPv6 DDNS

operations:
  source: [admin, user]
  personal_crontab: {root: absent, eureka: absent}
  application_internal_schedulers: 未核验
  backup_plan: 服务基本稳定后再建设 persistent 备份，尚未建立经恢复验证的方案

conventions:
  network:
    source: [network_handoff]
    accepted: "2026-10-23"
    scope: 05.1 系统与网络运行规范；本地审阅修订后接纳，未修改服务器，不表示所有规范均已逐项验证
    current_context: 入口、端口及核验来源复用 network 与 services，不将历史快照当作实时状态
    responsibilities:
      dns_ddns: 管理域名解析与动态地址更新，不承担端口转发或访问控制
      router: 管理 IPv4 公网端口到服务器的映射；IPv6 路径另查路由与防火墙
      ufw: 管理主机防火墙策略；容器发布端口的实际转发行为需结合 Docker 规则核验
      docker: 管理容器连接、宿主机端口发布及相关规则；host 网络服务按主机监听路径检查
      caddy: HTTP/HTTPS 入口、TLS、站点路由和反向代理
      application: 认证、授权与业务处理
    access:
      classification: 新增服务先明确仅容器内部、仅本机、局域网或公网的访问需求
      internal: 无需宿主机或外部访问时，不发布宿主机端口
      proxied_http: 当前 Caddy 为 host 网络，上游优先发布至 IPv4 回环地址
      compose_ports_example: "127.0.0.1:<HOST_PORT>:<CONTAINER_PORT>"
      example_scope: 仅为端口绑定示例，须替换端口并核对服务配置，不可直接部署
      lan_management: 结合监听地址、Caddy 来源限制和防火墙约束，验证非允许来源被拒绝；不默认公开管理入口
      public_web: 用户明确需要并授权后经 Caddy 接入，记录用途、访问范围、域名和完整转发链路
      public_checks: [DNS或DDNS, 路由器外部及内部端口, 监听地址, 对应协议族防火墙, Caddy站点及TLS与上游, 应用认证授权, IPv4与IPv6各自的暴露路径]
      internal_interfaces: 数据库、缓存及 Docker 管理接口等内部端口不直接公开；没有用途的公网端口保持关闭
    firewall:
      - 不仅凭 UFW 默认拒绝或链的默认 DROP 判断容器端口安全；还需检查提前 ACCEPT、NAT、实际转发及访问路径
      - iptables 的 nf_tables API 与 Docker 原生 nftables 后端是不同概念，规则检查方法须与实际后端相符
      - 优先通过 Compose 管理端口绑定和网络；不把临时手工规则当作持久部署配置
      - 不直接清空、重建或覆盖 Docker 管理的规则；必要调整先确认规则归属与持久化入口
      - IPv6 默认拒绝仍可能存在必要 ICMPv6 等允许规则；IPv4 成功不证明 IPv6 正常或安全
    change_process:
      before: 复用已知上下文，按变更范围读取精确现行配置；明确目标、影响、SSH 管理入口和可用回退方式，不引用已删除的备份
      during: 用户授权后逐项实施必要变更，调整负责该职责的配置；失败先分析，不叠加未经验证的修复
      after: 按范围验证本机上游、LAN、路由与 TLS、真实外网、其他原有入口及相关 IPv6 路径
      evidence: 记录测试位置、路径、时间、实际结果与来源；脱敏后交本地 Codex 验收，不将计划中的测试写成完成
      privacy: 仅提取任务所需字段；命令输出和日志可能含公网地址或凭据，分享前脱敏，不公开完整环境变量或 Caddy 管理 API 配置
    troubleshooting:
      method: 沿实际请求路径定位失败环节，结合本机上游对照测试；不要求前层全部通过才检查应用
      layers:
        - DNS 解析及 DDNS 目标是否符合预期
        - 公网 IPv4 映射的外部端口、内部地址及端口；IPv6 路径另查，不套用 IPv4 NAT 结论
        - 协议族、监听地址、防火墙及允许来源
        - Docker 当前发布端口、网络与实际转发规则；动态容器 IP 和规则不作为固定参数
        - Caddy 有效配置、Host 匹配、TLS、上游及必要日志；不可用摘要覆盖完整配置
        - 应用进程、健康检查、认证及业务日志
      read_only_commands:
        ufw: sudo ufw status verbose
        listeners: sudo ss -lntup
        containers: "sudo docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}'"
        iptables_ipv4: [sudo iptables -S FORWARD, sudo iptables -t nat -S]
        iptables_ipv6: [sudo ip6tables -S INPUT, sudo ip6tables -S FORWARD]
        caddy_logs: sudo docker compose -f /srv/apps/caddy/compose.yaml logs --tail=80
      command_scope: 按实际后端和故障范围选择最小只读检查；列表非完整审计脚本，原始输出先在本地检查并脱敏，不要求每次全套重跑
    validation_limits: IPv6 公网路径与完整 Docker 转发审查仍见 network.pending，不因规范交付而关闭
    references:
      checked: "2026-10-23"
      docker_firewall: https://docs.docker.com/engine/network/packet-filtering-firewalls/
      docker_native_nftables: https://docs.docker.com/engine/network/firewall-nftables/
      iptables_nft_api: https://manpages.debian.org/trixie/iptables/iptables-nft.8.en.html
