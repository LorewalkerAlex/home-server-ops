conventions:
  server_interaction:
    source: [interaction_agreement, rollback_exit_decision, predefined_upload_path, ssh_interaction_policy, format_temporary_policy]
    scope: 本地 Codex 与 Web 指导服务器操作时共用；不改变既有权限和用户执行变更的分工
    inspection: 本地 Codex 优先通过已有只读访问完成任务相关检查；需要管理员权限的最小检查由用户执行，不要求重跑已有有效证据
    default_delivery: 简单操作直接给可复制命令，用户在已有 SSH 会话执行；不为几条命令默认生成、上传独立脚本
    command_format: 标明执行位置、所需权限、作用及预期结果；按可验证的小步提供，遇到失败先分析，不让用户继续执行依赖失败步骤的命令
    inline_code: 少量多行逻辑可使用带引号分隔符的 heredoc；较长逻辑应保持可审查，不把复杂部署隐藏在单条命令或编码内容中
    script_use: 复杂或需重复执行的操作可以交付脚本或配置包，同时说明内容、运行命令、验证、回退及文件去向；不要求用户为每个步骤另存脚本
    execution_safety:
      phases: 按检查、候选校验、正式修改、访问验证和清理分阶段；不把修改／重启／多项网络测试／清理串成一次粘贴。依赖失败即暂停后续变更，无关只读诊断可分别继续并记录结果
      delivery_responsibility: 交付方审查最终命令的执行上下文，直接粘贴命令默认兼容登录Shell可能遗留的严格模式，不以用户先检查history／Shell选项或自行辨认上下文作为安全前提；简单操作仍直接给命令
      login_shell: 禁止在登录Shell开启set -e／set -u／pipefail，包括set -eu和set -euo pipefail等组合；不直接粘贴会退出或替换登录Shell的exit／logout／exec，不安装trap，不source部署脚本。确需严格模式仅在独立启动的bash脚本或bash heredoc内使用，外层用if分支接住返回码，不能仅靠子Shell隔离
      expected_failures: 拒绝／错误端口／grep无匹配等预期非零检查逐项使用条件分支（if command; then rc=0; else rc=$?; fi）捕获原始退出码，再判断预期结果；不能只在命令后echo $?或用|| true掩盖错误。分别记录curl退出码、HTTP或CONNECT状态及必要日志，非零退出码不自动等于验收失败，HTTP 000不代表已证实目标服务故障
      timeouts: 网络探测明确连接与总超时，其他可能阻塞的检查按需限时；超时只表示本次检查未完成。配置写入、安装、迁移等有副作用步骤不机械套强制终止，先说明中断风险和恢复检查
      records: 少量短检查可直接回传终端输出；批量／耗时或中断后难判断的操作按需在任务临时目录保留stdout与stderr、各步骤退出码、开始／结束时间及阶段标记，先确认可写并报告准确路径。输出避免凭据，不默认set -x；使用tee须保留原命令退出码，不能将tee成功当命令成功
      reconnect: 会话消失、步骤完成及验收通过分别判断；按最后已知步骤核对已有输出、相关进程／服务、配置哈希和日志，缺少结束标记只表示结果未知。先区分Shell退出与SSH传输中断，不凭断线重启服务或重跑整组命令，也不要求重查无关基础信息
      retry: 正式修改前核对相关原始状态及必要回退资料，沿用deployment.rollback_and_cleanup；重试先对照实际状态和已完成记录，不盲目创建副本、覆盖配置或重复加规则。部分应用或记录矛盾先分析，不能仅凭阶段标记自动跳过或续跑
      lifetime: 留存日志不保证SSH断开后任务继续；不默认后台运行或套nohup。确需独立执行时另行说明执行身份、任务标识、日志与状态查询、成功／失败及停止方法；阶段验收后按既有cleanup清理日志和临时产物，临时目录不承诺重启后仍存在
      references:
        - https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html
        - https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html
        - https://www.gnu.org/software/bash/manual/html_node/Signals.html
        - https://curl.se/docs/manpage.html
    upload_method: 分两步执行；可预先约定唯一任务目录并同轮分别给本地PowerShell上传和完整服务器SSH命令，看到Upload verified后才执行服务器命令，不必仅为取得路径回传一次；不让用户从日志找命令，不默认自动执行，密码按提示输入且不保存，已上传文件可复用
    temporary_directory: /tmp/home-server-ops/<任务标识>-<唯一后缀>/
    temporary_rules: 本项目在服务器手工创建的临时产物统一归入上述任务目录；按需创建且限制访问，根目录和任务目录0700，敏感文件0600，不为短命令强制落盘
    temporary_workspace:
      scope: 包括上传包及.partial、一次性脚本、PoC源码与测试数据、候选配置、诊断输出／阶段标记／测试日志及临时回退副本；同一任务的产物集中存放，不另在home、服务目录或其他临时根目录散放
      lifecycle: 创建前交代用途、准确任务路径、预计文件或资源及退出条件；任务标识加唯一后缀隔离并行操作，不能将目录存在当作允许复用或覆盖。阶段验收后精确清理已登记产物和空任务目录，固定根目录保留
      non_file_resources: PoC创建的容器、卷、监听、服务等不能仅靠删目录清理，须同步登记标识和退出处置；不因此自动授权创建任何资源
      exceptions: 工具强制就地创建的中间文件、容器内临时路径或必要运行时设备／挂载须在当前任务明确登记位置、原因和退出方式；软件自身缓存、正式运行日志、业务数据及数据备份遵循各自规则
      existing_state: 本规范不授权批量移动或删除已有文件；尤其不移动或清理正在使用的HDD映射表、只读设备及挂载。历史遗留按具体任务核对，不能为统一位置破坏当前运行状态
      persistence: /tmp不保证跨重启或系统清理保留，不保存唯一恢复材料；确需长期复用的脚本、配置或恢复资料审查后转入约定持久位置，并更新引用再退出临时目录
    durable_files: 正式配置和长期维护脚本放在约定的服务或持久路径；临时回退副本按deployment.rollback_and_cleanup退出，临时目录不能作为重要资料的唯一副本
    results: 用户返回必要的脱敏输出；本地 Codex 能直接只读复核的部分自行核验，验收后更新事实、任务和 Git，未执行的操作保持未完成
    cleanup: 交付时说明本次临时文件及回退副本的用途、路径、退出条件和清理方式；本次变更或阶段验收后给出精确清理命令并记录结果，额外保留明确理由和复核时间，不按通配符批删目录

  network:
    source: [network_handoff]
    accepted: "2026-10-23"
    scope: 05.1 系统与网络运行规范；本地审阅修订后接纳，未修改服务器，不表示所有规范均已逐项验证
    current_context: 入口、端口及核验来源复用 network 与 services，不将历史快照当作实时状态
    responsibilities:
      dns_ddns: 管理域名解析与动态地址更新，不承担端口转发或访问控制
      router: 管理 IPv4 公网端口到服务器的映射；IPv6 路径另查路由与防火墙
      ufw: 管理主机防火墙策略；容器发布端口的实际转发行为需结合 Docker 规则核验
      docker: 管理容器连接、宿主机端口发布及相关规则；host 网络服务按主机监听路径检查
      caddy: HTTP/HTTPS 入口、TLS、站点路由和反向代理
      application: 认证、授权与业务处理
    access:
      classification: 新增服务先明确仅容器内部、仅本机、局域网或公网的访问需求
      internal: 无需宿主机或外部访问时，不发布宿主机端口
      proxied_http: 当前 Caddy 为 host 网络，上游优先发布至 IPv4 回环地址
      compose_ports_example: "127.0.0.1:<HOST_PORT>:<CONTAINER_PORT>"
      example_scope: 仅为端口绑定示例，须替换端口并核对服务配置，不可直接部署
      lan_management: 结合监听地址、Caddy 来源限制和防火墙约束，验证非允许来源被拒绝；不默认公开管理入口
      public_web: 用户明确需要并授权后经 Caddy 接入，记录用途、访问范围、域名和完整转发链路
      public_checks: [DNS或DDNS, 路由器外部及内部端口, 监听地址, 对应协议族防火墙, Caddy站点及TLS与上游, 应用认证授权, IPv4与IPv6各自的暴露路径]
      internal_interfaces: 数据库、缓存及 Docker 管理接口等内部端口不直接公开；没有用途的公网端口保持关闭
    web_ingress:
      source: [caddy_ingress_design, split_dns_handoff, wifi_pac_handoff, wifi_pac_review]
      date: "2026-10-27"
      scope: 后续 Web 服务的复用规则；实际实施范围及验证状态见 services.caddy 与 network.unified_url_discussion
      names: 每项服务使用明确子域名；同一服务内外网共用域名、HTTPS 和 4129 端口，以 Tududi 为首项验证
      public_path: 公网 DNS/DDNS → 路由器 TCP 4129 → 服务器 443 → Caddy 按域名选择回环上游；新增 Web 服务共用该映射
      lan_path: 直接客户端使用家庭DNS到192.168.1.110的Caddy LAN4129；PAC客户端通过LAN Squid，由Squid用家庭DNS连接同一入口；DNS不负责改端口，PAC不接管所有应用的解析
      access_classes:
        public_and_lan: 经用户明确授权，在 443 与 LAN 4129 分别声明该服务域名；应用认证授权仍由应用负责
        lan_only: 仅在 192.168.1.110 的 4129 声明域名，并限制来源 192.168.1.0/24；不创建该服务的公网 443 代理路由
        ssh_only: 保留回环端口及 SSH 转发，不自动加入 Caddy；管理界面按实际用途另行授权
      boundaries: 所有 LAN 4129 站点使用一致的 LAN 绑定及来源限制；没有公网 DNS 记录不构成访问控制，不配置通配兜底业务代理
      upstreams: host 网络 Caddy 使用唯一、无冲突的 127.0.0.1 宿主机上游端口；不为每项 Web 服务另开公网端口
      layout: 当前保留单个 Caddyfile，使用公共片段及每服务上游片段；服务增加时添加明确站点，不预建未部署服务的路由
      handler_order: 来源限制与handle／handle_path共存时，必须核对adapt后的实际处理顺序；必要时在route内先拒绝再分流，不能只凭Caddyfile文字顺序或出现lan_only判断有效。部署后实际验证允许来源成功和非允许来源403，覆盖首页、API及WebSocket路径
      tls: AliDNS DNS-01 在全局 acme_dns 统一配置，凭据仍引用既有环境变量；同一域名不同端口共用证书，不重复定义冲突策略，不启用按需签发
      redirects: 保留自动证书管理，仅禁用自动 HTTP 跳转；需要的域名跳转显式指向 https://主机名:4129 并保留 URI，不开放公网 80
      protocols: 当前按 TCP 链路规划 h1/h2，不额外监听或映射 HTTP/3 的 UDP；以后确有需求再核对 UDP 转发及通告端口
      dns: 当前用户接受子域名通配A并本地处理其其他记录类型，根域仍转发；新增独立记录需求先设计例外，实际规则见services.dnsmasq，DNS解析不等于自动创建Caddy站点
      expansion: 先确定访问级别、域名、上游及应用外部 URL；按需配置公网 DNS、LAN DNS 和证书权限，再校验、应用并回归既有入口，最后更新事实与进度；需要供PAC客户端访问的新服务还须明确加入PAC主机清单和Squid域名ACL，Caddy或DNS新增不会自动获得代理放行
      change_control: 不修改全局 https_port；保留当前公网映射、LAN HTTP、DDNS 管理来源限制及证书数据目录；正式变更由用户执行
      file_loading: 单文件 bind 更新时核对宿主机、容器文件及有效路由，确认旧 inode 问题后才重建；以后拆分 include 文件需同步调整挂载，不能仅创建容器不可见的片段
      references:
        checked: "2026-10-25"
        globals: https://caddyserver.com/docs/caddyfile/options
        snippets: https://caddyserver.com/docs/caddyfile/directives/import
        binding: https://caddyserver.com/docs/caddyfile/directives/bind
        conversion: https://caddyserver.com/docs/api#post-adapt
        route_order: https://caddyserver.com/docs/caddyfile/directives/route
    firewall:
      - 不仅凭 UFW 默认拒绝或链的默认 DROP 判断容器端口安全；还需检查提前 ACCEPT、NAT、实际转发及访问路径
      - iptables 的 nf_tables API 与 Docker 原生 nftables 后端是不同概念，规则检查方法须与实际后端相符
      - 优先通过 Compose 管理端口绑定和网络；不把临时手工规则当作持久部署配置
      - 不直接清空、重建或覆盖 Docker 管理的规则；必要调整先确认规则归属与持久化入口
      - IPv6 默认拒绝仍可能存在必要 ICMPv6 等允许规则；IPv4 成功不证明 IPv6 正常或安全
    change_process:
      before: 复用已知上下文，按变更范围读取精确现行配置；明确目标、影响、SSH 管理入口和可用回退方式，不引用已删除的备份
      during: 用户授权后逐项实施必要变更，调整负责该职责的配置；失败先分析，不叠加未经验证的修复
      after: 按范围验证本机上游、LAN、路由与 TLS、真实外网、其他原有入口及相关 IPv6 路径
      evidence: 记录测试位置、路径、时间、实际结果与来源；脱敏后交本地 Codex 验收，不将计划中的测试写成完成
      privacy: 仅提取任务所需字段；命令输出和日志可能含公网地址或凭据，分享前脱敏，不公开完整环境变量或 Caddy 管理 API 配置
    troubleshooting:
      method: 沿实际请求路径定位失败环节，结合本机上游对照测试；不要求前层全部通过才检查应用
      layers:
        - DNS 解析及 DDNS 目标是否符合预期
        - 公网 IPv4 映射的外部端口、内部地址及端口；IPv6 路径另查，不套用 IPv4 NAT 结论
        - 协议族、监听地址、防火墙及允许来源
        - Docker 当前发布端口、网络与实际转发规则；动态容器 IP 和规则不作为固定参数
        - Caddy 有效配置、Host 匹配、TLS、上游及必要日志；不可用摘要覆盖完整配置
        - 应用进程、健康检查、认证及业务日志
      read_only_commands:
        ufw: sudo ufw status verbose
        listeners: sudo ss -lntup
        containers: "sudo docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}'"
        iptables_ipv4: [sudo iptables -S FORWARD, sudo iptables -t nat -S]
        iptables_ipv6: [sudo ip6tables -S INPUT, sudo ip6tables -S FORWARD]
        caddy_logs: sudo docker compose -f /srv/apps/caddy/compose.yaml logs --tail=80
      command_scope: 按实际后端和故障范围选择最小只读检查；列表非完整审计脚本，原始输出先在本地检查并脱敏，不要求每次全套重跑
    validation_limits: IPv6 公网路径与完整 Docker 转发审查仍见 network.pending，不因规范交付而关闭
    references:
      checked: "2026-10-23"
      docker_firewall: https://docs.docker.com/engine/network/packet-filtering-firewalls/
      docker_native_nftables: https://docs.docker.com/engine/network/firewall-nftables/
      iptables_nft_api: https://manpages.debian.org/trixie/iptables/iptables-nft.8.en.html

  deployment:
    source: [deployment_standard_review, rollback_exit_decision, information_integrity_policy, format_temporary_policy]
    accepted: "2026-10-23"
    scope: 05.2 新服务部署规范与 README 模板；适用于后续部署和变更，不据此批量改造现有服务
    directories: 复用 directories 中 apps、persistent/data、persistent/secrets 和运行时盘的分工，不新增目录体系
    network: 复用 conventions.network，不另定端口开放规则
    minimum_requirements:
      compose: 每个服务在部署目录维护 compose.yaml，记录 Compose 服务名及必要依赖；自定义镜像同时保留 Dockerfile 和构建方法
      images: 使用明确版本标签，记录实际镜像 ID 或可获取的 digest；自定义构建固定基础镜像版本和插件版本或提交，不仅记录本地标签
      data: 逐项列出宿主机路径或卷、容器目标、读写模式及保留需求；重要数据显式声明持久挂载，同时检查镜像 VOLUME 引入的匿名卷，不能按所在磁盘推断可删除
      permissions: 创建挂载目录前明确应用 UID/GID 和必需写权限；不以全局可写权限解决访问错误，迁移现有数据前核对归属和保留要求
      secrets: 放入已约定的 secrets 目录，通过应用支持的文件挂载或 env_file 等方式注入；公开文档只记录路径、变量名及加载方式，不记录值
      secret_permissions: 默认目录 0700、文件 0600，由实际读取账号持有；确需组访问时使用专用组及最小权限并记录原因，核对容器 UID/GID 能否读取
      privilege: 默认不使用 privileged、不挂载 Docker socket、不增加无关 capabilities；评估非 root、只读根文件系统和 no-new-privileges 的兼容性，采用或例外均注明，不把它们当作现有服务事实
      restart: 长期运行服务默认 unless-stopped；一次性任务等按用途另定并注明，不直接套用常驻策略
      health: 有可靠业务探针时设置健康检查；否则记录替代的 HTTP、API 或功能验证，running 状态不等于业务健康
      logs: 容器日志须有有限轮转；以下为新服务默认片段，已有等效设置可保留。应用自行写入的文件日志另设保留策略，Docker 日志轮转不覆盖这些文件
    compose_service_defaults:
      restart: unless-stopped
      logging:
        driver: local
        options: {max-size: "10m", max-file: "3"}
    defaults_scope: 上述只是常驻服务的 Compose 服务级片段，不能替换完整配置；核对实际容器日志设置，daemon 默认变更不会自动改写已有容器
    configuration:
      authority: README 标明权威文件、加载方式及验证方法，正式部署只引用明确的配置来源
      declaration_check: 用 docker compose -f <COMPOSE_FILE> config -q 验证声明；通过仅说明解析及一致性检查通过，不证明应用配置或业务正常
      deployed_check: 按变更范围提取实际镜像、网络、端口和挂载等必要字段；检查单文件 bind 时可比对两端哈希，避免输出完整 inspect 或环境变量
      effective_check: 服务支持时检查已加载配置的必要字段，并验证实际响应；不支持运行配置查询时注明限制，使用业务行为验证，不强行要求统一接口
      sensitive_output: 普通 compose config 会展开变量，Caddy 管理 API 和日志也可能包含秘密；仅保留必要的脱敏结果
    information_integrity:
      artifact_boundary: 准备时明确模板、正式交付内容和历史证据各自用途；脚本生成配置时检查实际将写入的最终内容，不能只检查脚本说明或源模板。历史证据保留原样并标明历史，不靠全局替换消除真实的未完成记录
      stable_comments: 正式配置只保留稳定用途、结构和必要约束说明；候选／未加载／已部署等阶段状态放在带来源与核验时间的事实或任务记录，不能由文件位置、脚本变量名或注释推定运行状态
      before_apply: 交付前同时审查有效配置、注释和邻近操作说明，查找模板标记、未替换占位符、旧入口／目录、过期状态及失效回退路径；发现矛盾先纠正或明确适用范围，不随候选文件一并带入正式路径
      after_apply: 按本次变更范围回读正式文件的相关说明，结合加载结果／响应核对，再同步当前事实、进度和受影响服务文档；用户未执行的文档修正保持待纠正，不把写好候选或Git提交当服务器已改
      acceptance: 技术行为与文字一致性分别记录；语法通过、哈希相同或服务可用不能替代说明正确。未解释的认知矛盾存在时，不宣布本次文字收尾或整个交付全部通过；已完成的技术阶段无需因此重做
      screening: 使用只读关键字初筛辅助发现正式配置中的阶段断言和模板残留，报告位置而不回显完整内容或凭据；初筛通过不等于语义验收，Web按相同检查项审阅，无需读取本机私有工具
      scope: 覆盖本次新增／修改及已明确发现的问题，不要求每次全盘重查；真实未知、历史快照和可复用模板可保留准确标识，不机械删除候选或待验证字样
    apply_changes:
      caddy_format: 使用当前部署版本的caddy fmt规范最终Caddyfile，再校验和应用；fmt检测出差异的非零返回须显式处理，不能触发登录Shell退出。纯排版先比较格式化前后adapt结果及内嵌PAC正文，等价时原位写回并核对容器读取及格式结果，不因排版重启或重建服务
      approval: 服务器变更仍由用户授权；执行前确认现行配置、影响及可用回退资料，失败先分析
      restart: compose restart 只重启现有容器，不用于应用 Compose 或环境变量变更
      reload: 应用配置变化时先用对应服务校验，再使用其支持的重载方式；核对容器确实读到新文件
      recreate: Compose 配置或注入的环境变量变化后，用 compose up -d <SERVICE> 应用并核对实际状态；仅在确认需要时使用 --force-recreate，不把重建当作所有故障的通用修复
      published_image: 按选定版本拉取普通镜像，再应用配置并验证实际运行镜像与业务；不默认自动升级
      custom_image: 按 Dockerfile、基础镜像及插件版本构建并记录镜像身份后再更新容器；只有 Compose 声明 build 时才依赖 Compose 构建，不能把 pull 当作自定义构建
      caddy_case: 复用 services.caddy 的构建与单文件挂载记录；容器内验证和 reload 前核对所读文件，文件一致不代替有效路由与 TLS 验证
    acceptance:
      - 按范围核对声明、实际镜像及挂载、已加载配置或替代验证，并记录主体、时间与结果
      - 验证健康或业务响应及所需访问路径；涉及公网或管理限制时复用网络规范的验证要求
      - 回读正式配置的相关注释和受影响服务说明，与实际结果、当前事实和任务状态一致；未解释差异和未验证项明确，文字收尾与技术结果分别验收
      - Caddyfile应通过当前版本的规范格式检查，不把格式警告长期当作可忽略项；其他配置按其工具实际支持的检查方式处理
    rollback_and_cleanup:
      rollback: 分别记录配置回退、镜像回退与业务数据恢复；涉及数据库迁移先核对降级兼容性，不能保证仅换回旧镜像即可恢复
      retention: 只为本次变更创建必需的已知可用回退版本，创建前定义用途、回退触发及退出条件，创建后记录准确路径和清理命令；默认本次变更或阶段验收通过后清理，不等待父任务或后续无关工作
      location: 临时配置回退副本与候选文件同属server_interaction.temporary_workspace，归入当前任务临时目录，不在正式服务目录长期堆积；业务数据备份不套用此位置规则
      retention_exception: 验证失败时用于回退，恢复且核验后清理；确需额外观察时说明理由、具体复核时间和到期处置，不接受只有“继续保留”的安排
      cleanup: 达到退出条件即交付精确清理命令，用户执行后记录实际结果；未收到结果不标为已删除，不按扩展名或目录位置批删
      data_backup_scope: 业务数据备份、原始恢复材料按各自的数据保全与保留策略处理，不套用临时配置副本的退出规则
      backup_boundary: README 分别记录备份生成、完整性检查和实际恢复验证状态；未建立时如实写明，05.3 负责后续备份与恢复建设
    documentation:
      server_readme: 后续新增服务或相关变更时，在 /srv/apps/<service>/README.md 使用下方模板；本轮未创建或修改服务器文件
      public_repository: 仍只维护 README.md、AGENTS.md、facts.yaml、progress.md；事实和规范放 facts，任务放 progress，不复制完整服务 README 或运行配置
      maintenance: 配置、镜像、访问入口或数据位置变化后更新相关文档；省略不适用部分，未核实项标明来源与限制，不为填写模板新增功能
    readme_template: |
      # <服务名称>

      ## 用途与状态
      用途：<说明>；当前状态：<结果>；最后核验：<时间、主体和证据>。
      已知限制：<未核验、不适用或存在的问题>。

      ## 部署与配置
      部署目录与 Compose：<路径>；Compose 服务名／容器名：<名称>。
      镜像：<版本及 ID/digest>；自定义构建：<Dockerfile、基础镜像、插件版本及构建方法，不适用则省略>。
      权威配置与加载方式：<文件、挂载目标或环境注入>；运行 UID/GID 与权限：<核验结果>。
      重启策略、健康检查或替代验证、日志轮转：<实际配置及例外>。

      ## 访问入口
      访问范围：<内部／本机／LAN／公网>；实际入口：<仅填适用地址>。
      链路：<外部端口、服务器监听、Caddy 上游、容器端口>；来源限制与认证：<实际设置>。

      ## 数据与密钥位置
      持久挂载：<逐项列宿主机路径或卷 → 容器目标、读写模式、用途及保留要求>。
      私密配置：<只记位置、加载方式、所有者及权限，不写凭据值>。
      备份与恢复：<分别写备份生成、完整性检查、恢复验证的状态和必要说明；未建设时明确写明>。

      ## 常用操作
      - 状态：`sudo docker compose -f <COMPOSE_FILE> ps`
      - 日志：`sudo docker compose -f <COMPOSE_FILE> logs --tail=80 <SERVICE>`
      - 声明校验：`sudo docker compose -f <COMPOSE_FILE> config -q`
      - 配置生效：<服务校验和重载方法，或需要重建容器的条件及具体命令>。
      - 单纯重启：<命令及适用条件>；业务验收：<预期响应和所需访问路径>。

      ## 升级与回退
      镜像更新或构建：<适用命令、版本选择、必要数据准备及兼容性要求>。
      配置回退：<真实可用版本和操作>；镜像回退：<可用镜像及适用限制>。
      数据恢复：<步骤或已有说明的位置、验证结果和限制；未验证则注明>。
      维护说明：<仅记录影响后续维护的变更，不依赖已删除文件回退>。
    template_scope: 将占位符替换为实际参数后再使用，命令须匹配现行部署；分享内容须符合公开仓库脱敏规则
    references:
      checked: "2026-10-23"
      compose_config: https://docs.docker.com/reference/cli/docker/compose/config/
      compose_restart: https://docs.docker.com/reference/cli/docker/compose/restart/
      compose_up: https://docs.docker.com/reference/cli/docker/compose/up/
      local_logging: https://docs.docker.com/engine/logging/drivers/local/
      caddy_reload_validate: https://caddyserver.com/docs/command-line
